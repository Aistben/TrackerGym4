<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Колонист · 2D база и ресурсы</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #10131c; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8eefc; }
    #cv { position: fixed; inset: 0; display: block; }

    .hud { position: fixed; z-index: 10; user-select: none; }

    /* Инвентарь */
    #inv {
      top: 14px; left: 14px; display: flex; gap: 8px;
      background: rgba(12, 16, 26, .72); border: 1px solid rgba(255,255,255,.12);
      padding: 8px 12px; border-radius: 14px; backdrop-filter: blur(6px);
      font-size: 14px; font-weight: 700;
    }
    #inv span { display: flex; align-items: center; gap: 6px; }
    #inv .num { color: #ffd76e; min-width: 26px; }

    /* День и кнопки */
    #topright { top: 14px; right: 14px; display: flex; gap: 8px; align-items: center; }
    #daybox {
      background: rgba(12, 16, 26, .72); border: 1px solid rgba(255,255,255,.12);
      padding: 8px 14px; border-radius: 14px; font-size: 14px; font-weight: 700;
      backdrop-filter: blur(6px); display: flex; gap: 8px; align-items: center;
    }
    .ibtn {
      width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
      background: rgba(12, 16, 26, .72); border: 1px solid rgba(255,255,255,.14);
      color: #cfd9f0; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .ibtn:hover { background: rgba(40, 50, 80, .85); }

    /* Хотбар */
    #hotbar {
      bottom: 52px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .slot {
      width: 62px; height: 66px; border-radius: 14px; cursor: pointer; position: relative;
      background: rgba(12, 16, 26, .72); border: 2px solid rgba(255,255,255,.14);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      backdrop-filter: blur(6px);
    }
    .slot.sel { border-color: #ffd76e; box-shadow: 0 0 16px rgba(255, 200, 80, .35); }
    .slot .ic { font-size: 22px; line-height: 1; }
    .slot .nm { font-size: 9.5px; color: #aeb9d4; font-weight: 700; white-space: nowrap; }
    .slot .cost { font-size: 9.5px; color: #8fd48f; font-weight: 700; }
    .slot.poor .cost { color: #e57373; }
    .slot .key { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #6f7a94; font-weight: 800; }

    #help {
      bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #93a2c8; white-space: nowrap;
      background: rgba(8, 12, 22, .6); border: 1px solid rgba(120,150,255,.14);
      padding: 6px 14px; border-radius: 10px; backdrop-filter: blur(6px);
    }
    #help b { color: #cfe0ff; }

    #toast {
      top: 66px; left: 50%; transform: translateX(-50%) translateY(-8px);
      font-size: 15px; font-weight: 700; color: #fffbe8;
      background: rgba(60, 40, 10, .8); border: 1px solid rgba(255, 200, 80, .5);
      padding: 9px 20px; border-radius: 12px; opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #link3d {
      bottom: 12px; right: 12px; font-size: 12px; color: #93a2c8; text-decoration: none;
      background: rgba(8, 12, 22, .6); border: 1px solid rgba(120,150,255,.18);
      padding: 6px 12px; border-radius: 10px;
    }
    #link3d:hover { color: #cfe0ff; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div class="hud" id="inv">
    <span>🪵 <span class="num" id="inv-wood">0</span></span>
    <span>🪨 <span class="num" id="inv-stone">0</span></span>
  </div>

  <div class="hud" id="topright">
    <div id="daybox"><span id="clockIcon">☀️</span><span id="dayLabel">День 1</span></div>
    <button class="ibtn" id="btnMute" title="Звук (M)">🔊</button>
    <button class="ibtn" id="btnReset" title="Начать заново">🔄</button>
  </div>

  <div class="hud" id="toast"></div>
  <div class="hud" id="hotbar"></div>
  <div class="hud" id="help">
    <b>A/D</b> — идти · <b>W/Пробел</b> — прыжок · <b>ЛКМ</b> — рубить/копать/строить · <b>1–5</b>/колесо — слот · <b>ПКМ</b> — отмена · <b>M</b> — звук
  </div>
  <a class="hud" id="link3d" href="./3d.html">🎮 3D-версия</a>

  <script src="./game2d.js"></script>
</body>
</html>
